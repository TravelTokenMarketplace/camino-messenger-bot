name: Publish Docker image to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag_latest:
        description: 'Also tag the image as latest'
        required: true
        type: boolean
        default: false

jobs:
  push_to_dockerhub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Calculate Docker image tags
        id: meta
        run: |
          REF_NAME="${{ github.ref_name }}"
          REF_NAME_CLEAN="${REF_NAME//\//-}"
          IMAGE_NAME="c4tplatform/camino-messenger-bot"
          TAGS="${IMAGE_NAME}:${REF_NAME_CLEAN}"
          if [ "${{ inputs.tag_latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CAMINO_BOT_COMMIT=${{ github.sha }}
            CAMINO_BOT_TAG=${{ github.ref_name }}